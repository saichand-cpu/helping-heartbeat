name: HumanLink Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Firebase for Android
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Verify Firebase configuration
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        run: test -s android/app/google-services.json

      - name: Build debug APK
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: humanlink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release bundle
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: humanlink-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Firebase setup notice
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 == '' }}
        run: |
          echo "GOOGLE_SERVICES_JSON_B64 is not configured. Web build completed; Android/FCM build was intentionally skipped."
